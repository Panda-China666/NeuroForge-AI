[project]
name = "neuroforge-ai"
version = "0.4.1"
description = "Local neural architecture engineering workbench"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["neuroforge*"]
[project.scripts]
neuroforge = "neuroforge.cli:main"

[project.optional-dependencies]
ecosystem = ["torchvision==0.23.0", "timm==1.0.22", "transformers==4.57.1", "safetensors==0.6.2"]

[tool.setuptools.package-data]
neuroforge = ["prompts/*.md"]
